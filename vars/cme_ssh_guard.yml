---
# Roles that break AAP SSH to the demo fleet (Permission denied publickey).
#
# CME-1204/801/804/806/901 rewrite sshd_config and restart sshd.
# CME-401 sets update-crypto-policies FUTURE, which rejects ssh-rsa.
# CME-202 is currently a no-op; skip if it gains real firewall tasks.
# CME-502/503 call ansible.posix.mount with src defaulting to tmpfs when
# /home is not a separate partition (typical EC2). That overlays an empty
# tmpfs on /home, hiding authorized_keys. Job after skipping 1204 still
# locked the fleet this way.
cme_ssh_unsafe_controls:
  - cme_202
  - cme_401
  - cme_502
  - cme_503
  - cme_801
  - cme_804
  - cme_806
  - cme_901
  - cme_1204
