---
# Copy this file to vars/vault.yml, replace every CHANGE_ME value with
# credentials for YOUR lab, then encrypt:
#
#   cp vars/vault.example.yml vars/vault.yml
#   ansible-vault encrypt vars/vault.yml
#
# Never commit vars/vault.yml.

vault_ansible_user: "ec2-user"
vault_ssh_private_key: "CHANGE_ME"
vault_ssh_key_path: "~/.ssh/id_ed25519"

vault_controller_host: "https://aap.example.com"
vault_controller_username: "admin"
vault_controller_password: "CHANGE_ME"
vault_controller_token: "CHANGE_ME"

vault_registry_username: "CHANGE_ME"
vault_registry_password: "CHANGE_ME"

vault_gitea_admin_password: "CHANGE_ME"
vault_gitea_api_token: "CHANGE_ME"

vault_github_scm_username: "CHANGE_ME"
vault_github_scm_token: "CHANGE_ME"
vault_eda_gitea_webhook_secret: "CHANGE_ME"

vault_keycloak_admin_password: "CHANGE_ME"
vault_keycloak_demo_password: "CHANGE_ME"
vault_rhtpa_oidc_client_secret: "CHANGE_ME"

vault_pg_admin_password: "CHANGE_ME"
vault_pg_db_password: "CHANGE_ME"

vault_snow_username: "CHANGE_ME"
vault_snow_password: "CHANGE_ME"
