---
# Demo 4b: App Dependency Remediation — GitOps Path (Gitea)
#
# Lightwell publishes a fixed library version. This workflow opens a
# Pull Request in Gitea updating the dependency version. The job stops
# there — merge in Gitea is the human approval. The resulting push to
# main runs Gitea Actions, which builds against the Lightwell index
# (PyPI for Demo 4, Maven for Demo 5).
#
# Flow:
#   Lightwell publishes fix to PyPI index
#     → Controller opens PR updating dependency version
#     → Human reviews and merges in Gitea (approval gate)
#     → Gitea Actions builds and tests the patched application
#     → Gitea writes an app SBOM; EDA launches App Ingest and Deploy
#
# Triggered by: EDA (app_dependency_fix_gitops event)

- name: "App Dependency Fix — GitOps PR Workflow"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../vars/vault.yml
  vars:
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"
    app_name: "{{ demo_app_name }}"
    dependency_file: "{{ demo_app_dependency_file }}"
    pin_style: "{{ demo_app_pin_style | default('pip') }}"
    target_branch: "{{ demo_app_target_branch | default('main') }}"
    gitea_url: "{{ demo_gitea_url }}"
    gitea_api: "{{ demo_gitea_url }}/api/v1"
    gitea_owner: "{{ demo_gitea_owner }}"
    gitea_repo: "{{ app_name }}"
    gitea_token: "{{ vault_gitea_api_token }}"
    lightwell_index_url: "{{ demo_lightwell_pypi_url }}"
    fix_branch: "security/{{ affected_library }}-{{ fixed_version }}"

  tasks:
    - name: "Phase 1 — Create fix branch and update dependency"
      block:
        - name: Create fix branch via Gitea API
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/branches"
            method: POST
            headers:
              Authorization: "token {{ gitea_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              new_branch_name: "{{ fix_branch }}"
              old_branch_name: "{{ target_branch }}"
            status_code: [201, 409]
          register: branch_result

        - name: Read current dependency file
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/contents/{{ dependency_file }}?ref={{ fix_branch }}"
            method: GET
            headers:
              Authorization: "token {{ gitea_token }}"
            status_code: [200]
          register: dep_file

        - name: Build updated content
          ansible.builtin.set_fact:
            current_deps: "{{ dep_file.json.content | b64decode }}"
            file_sha: "{{ dep_file.json.sha }}"

        - name: Compute fixed pip pin
          ansible.builtin.set_fact:
            updated_deps: "{{ current_deps | regex_replace(affected_library + '[=<>~!][^\\n]*', affected_library + '==' + fixed_version) }}"
          when: pin_style == "pip"

        - name: Compute fixed Maven property
          ansible.builtin.set_fact:
            updated_deps: "{{ current_deps | regex_replace('<' + affected_library + '\\.version>[^<]+</' + affected_library + '\\.version>', '<' + affected_library + '.version>' + fixed_version + '</' + affected_library + '.version>') }}"
          when: pin_style == "maven"

        - name: Commit updated dependency to fix branch
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/contents/{{ dependency_file }}"
            method: PUT
            headers:
              Authorization: "token {{ gitea_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              message: "Update {{ affected_library }} to {{ fixed_version }}\n\nLightwell update available for {{ affected_library }}. Rebuild required."
              content: "{{ updated_deps | b64encode }}"
              sha: "{{ file_sha }}"
              branch: "{{ fix_branch }}"
              committer:
                name: "AAP Security Automation"
                email: "aap-security@example.com"
            status_code: [200, 409]
          when: current_deps != updated_deps

    - name: "Phase 2 — Open Pull Request"
      block:
        - name: Create pull request via Gitea API
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/pulls"
            method: POST
            headers:
              Authorization: "token {{ gitea_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              title: "Update {{ affected_library }} to {{ fixed_version }} and rebuild"
              body: |
                The package {{ affected_library }} needs to be updated to {{ fixed_version }} and the application rebuilt.

                Lightwell update available for {{ affected_library }}.

                Merge this PR to pin the new version. Gitea Actions will rebuild from `main` using the Lightwell index.
              head: "{{ fix_branch }}"
              base: "{{ target_branch }}"
            status_code: [201, 409]
          register: pr_result

        - name: Find existing open PR if create returned conflict
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/pulls?state=open"
            method: GET
            headers:
              Authorization: "token {{ gitea_token }}"
            status_code: [200]
          register: open_prs
          when: pr_result.status == 409

        - name: Record PR details
          ansible.builtin.set_fact:
            pr_number: "{{ pr_result.json.number if pr_result.status == 201 else (open_prs.json | selectattr('head.ref', 'equalto', fix_branch) | map(attribute='number') | first) }}"
            pr_url: "{{ pr_result.json.html_url if pr_result.status == 201 else (open_prs.json | selectattr('head.ref', 'equalto', fix_branch) | map(attribute='html_url') | first) }}"

        - name: Display PR
          ansible.builtin.debug:
            msg: |
              === GITOPS PR OPENED — WAITING FOR APPROVAL ===
              PR: {{ pr_url }}
              Branch: {{ fix_branch }} → {{ target_branch }}
              Package: {{ affected_library }} {{ fixed_version }}
              Lightwell update available for {{ affected_library }}.
              Merge this PR in Gitea to rebuild.
              ============================================================

        - name: Publish PR details for AO
          ansible.builtin.set_stats:
            data:
              ao_pr_number: "{{ pr_number | string }}"
              ao_pr_url: "{{ pr_url }}"
              ao_repo_name: "{{ gitea_repo }}"
              ao_fix_branch: "{{ fix_branch }}"
