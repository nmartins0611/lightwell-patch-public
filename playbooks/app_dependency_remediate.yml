---
# Demo 4a: App Dependency Remediation — CI/CD Direct Path (Gitea)
#
# Lightwell publishes a fixed library version. This playbook pins the
# dependency on Gitea main (no PR). The GitOps path is App GitOps
# Remediate: open PR, merge, then Gitea Actions builds.
#
# KEY DISTINCTION: App dependencies are a BUILD-TIME fix, not deploy-time.
# Unlike OS packages (dnf update on live system), application libraries are
# baked into the application. Remediation goes through CI/CD, not package manager.
#
# Triggered by: EDA (app_dependency_fix event)

- name: "App Dependency Fix — CI/CD Rebuild Pipeline"
  hosts: localhost
  vars_files:
    - ../vars/vault.yml
  connection: local
  gather_facts: true
  vars:
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"
    app_name: "{{ demo_app_name }}"
    dependency_file: "{{ demo_app_dependency_file }}"
    gitea_url: "{{ demo_gitea_url }}"
    gitea_api: "{{ demo_gitea_url }}/api/v1"
    gitea_owner: "{{ demo_gitea_owner }}"
    gitea_repo: "{{ demo_app_name }}"
    gitea_token: "{{ vault_gitea_api_token }}"
    lightwell_index_url: "{{ demo_lightwell_pypi_url }}"
    target_branch: "{{ demo_app_target_branch | default('main') }}"

  tasks:
    - name: "Phase 1 — Update dependency in Gitea via API"
      block:
        - name: Read current requirements.txt from Gitea
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/contents/{{ dependency_file }}"
            method: GET
            headers:
              Authorization: "token {{ gitea_token }}"
              Accept: "application/json"
            status_code: [200]
          register: dep_file

        - name: Decode current file content
          ansible.builtin.set_fact:
            current_deps: "{{ dep_file.json.content | b64decode }}"
            file_sha: "{{ dep_file.json.sha }}"

        - name: Build updated requirements content
          ansible.builtin.set_fact:
            updated_deps: "{{ current_deps | regex_replace(affected_library + '[=<>~!][^\\n]*', affected_library + '==' + fixed_version) }}"

        - name: Commit dependency update via Gitea API
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_owner }}/{{ gitea_repo }}/contents/{{ dependency_file }}"
            method: PUT
            headers:
              Authorization: "token {{ gitea_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              message: "fix(security): update {{ affected_library }} to {{ fixed_version }}\n\nResolves {{ cve_id }} via Lightwell-published fix.\nSource: {{ lightwell_index_url }}"
              content: "{{ updated_deps | b64encode }}"
              sha: "{{ file_sha }}"
              branch: "{{ target_branch }}"
              committer:
                name: "AAP Security Automation"
                email: "aap-security@example.com"
            status_code: [200]
          register: commit_result

        - name: Display commit
          ansible.builtin.debug:
            msg: "Committed: {{ commit_result.json.commit.html_url | default('OK') }}"

    - name: "Phase 2 — Gitea Actions builds from the push to main"
      ansible.builtin.debug:
        msg: |
          Pin committed on {{ target_branch }}.
          That push starts Gitea Actions (Build after merge).
          For the approval beat: launch App GitOps Remediate and merge
          the PR in Gitea instead of committing straight to main.
