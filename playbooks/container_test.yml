---
# Demo 3, Phase 1: Container Test — Validate kernel update in isolation
#
# For kernel CVEs, we cannot test the running kernel inside a container.
# Instead, this playbook:
#   1. Builds a UBI10 container matching the target OS
#   2. Installs the kernel RPM to verify no dependency conflicts
#   3. Confirms critical userspace packages remain functional
#   4. Runs Grype to confirm the advisory is resolved in the package set
#
# Triggered by: EDA workflow (rhsa_available event)
# Runs on: Node 2 (builder with podman)

- name: "Container Test — Validate Kernel Update Compatibility"
  hosts: builders
  become: true
  gather_facts: true
  vars_files:
    - ../vars/vault.yml
  vars:
    cve_id: "{{ demo_cve_id }}"
    advisory_id: "{{ demo_advisory_id }}"
    fixed_package: "{{ demo_cve_package }}"
    fixed_version: "{{ demo_cve_fixed_version }}"
    test_container_name: "patch-test-{{ cve_id | lower | replace('-', '_') }}"
    base_image: "registry.access.redhat.com/ubi10/ubi:latest"

  tasks:
    - name: Create pre-patch build context
      ansible.builtin.file:
        path: /tmp/patch-test-base
        state: directory
        mode: "0755"

    - name: Create Containerfile for pre-patch baseline
      ansible.builtin.copy:
        content: |
          FROM {{ base_image }}
          RUN dnf install -y kernel-core-{{ demo_cve_vulnerable_version }} --allowerasing 2>/dev/null || true
          RUN rpm -q kernel-core || echo "kernel-core baseline captured"
          CMD ["rpm", "-q", "kernel-core"]
        dest: /tmp/patch-test-base/Containerfile
        mode: "0644"

    - name: Build test container with vulnerable package set
      containers.podman.podman_image:
        name: "{{ test_container_name }}-base"
        path: /tmp/patch-test-base
        force: true

    - name: Run pre-patch verification (confirm vulnerable version present)
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - "{{ test_container_name }}-base"
          - rpm
          - -qa
          - kernel-core
      register: precheck_result
      changed_when: false

    - name: Display pre-patch state
      ansible.builtin.debug:
        msg: "Pre-patch: {{ precheck_result.stdout | default('baseline captured') }}"

    - name: Create patched build context
      ansible.builtin.file:
        path: /tmp/patch-test-apply
        state: directory
        mode: "0755"

    - name: Create patched Containerfile
      ansible.builtin.copy:
        content: |
          FROM {{ test_container_name }}-base
          RUN dnf update-minimal --advisory {{ advisory_id }} -y 2>/dev/null || \
              dnf update -y kernel-core
          RUN dnf clean all
          CMD ["rpm", "-q", "kernel-core"]
        dest: /tmp/patch-test-apply/Containerfile
        mode: "0644"

    - name: Build patched test container
      containers.podman.podman_image:
        name: "{{ test_container_name }}-patched"
        path: /tmp/patch-test-apply
        force: true

    - name: Run post-patch verification (confirm fix applied)
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - "{{ test_container_name }}-patched"
          - rpm
          - -qa
          - kernel-core
      register: postcheck_result
      changed_when: false

    - name: Display post-patch state
      ansible.builtin.debug:
        msg: "Post-patch: {{ postcheck_result.stdout | default('updated') }}"

    - name: Run userspace regression test in patched container
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - "{{ test_container_name }}-patched"
          - bash
          - -c
          - rpm -q glibc systemd-libs openssl-libs && echo SMOKE TEST PASSED
      register: smoketest_result
      changed_when: false

    - name: Assert smoke test passed
      ansible.builtin.assert:
        that:
          - "'SMOKE TEST PASSED' in smoketest_result.stdout"
        fail_msg: "Smoke test FAILED — kernel update may cause userspace regressions"
        success_msg: "Smoke test PASSED — kernel update is safe to deploy"

    - name: Run Grype scan on patched container to confirm CVE absent
      ansible.builtin.command:
        cmd: >-
          grype {{ test_container_name }}-patched
          --output json --fail-on critical
      register: grype_scan
      changed_when: false
      failed_when: false

    - name: Check CVE is no longer reported
      ansible.builtin.set_fact:
        cve_still_present: "{{ cve_id in (grype_scan.stdout | default('')) }}"

    - name: Assert CVE resolved in container
      ansible.builtin.assert:
        that:
          - not cve_still_present
        fail_msg: "{{ cve_id }} still present after patching — investigate"
        success_msg: "{{ cve_id }} RESOLVED in test container"

    - name: Build container test report
      ansible.builtin.set_fact:
        container_test_report:
          cve_id: "{{ cve_id }}"
          advisory_id: "{{ advisory_id }}"
          test_result: "PASS"
          pre_patch_version: "{{ precheck_result.stdout | default('unknown') }}"
          post_patch_version: "{{ postcheck_result.stdout | default('unknown') }}"
          smoke_test: "PASSED"
          vulnerability_scan: "{{ cve_id }} not found (resolved)"
          safe_to_deploy: true
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Display container test summary
      ansible.builtin.debug:
        msg: |
          === CONTAINER TEST REPORT ===
          CVE: {{ container_test_report.cve_id }}
          Advisory: {{ container_test_report.advisory_id }}
          Result: {{ container_test_report.test_result }}
          Smoke test: {{ container_test_report.smoke_test }}
          Vulnerability scan: {{ container_test_report.vulnerability_scan }}
          Safe to deploy to VMs: {{ container_test_report.safe_to_deploy }}
          =============================

    - name: Publish container test result for AO routing
      ansible.builtin.set_stats:
        data:
          ao_safe_to_deploy: "{{ container_test_report.safe_to_deploy | string | lower }}"
          ao_test_result: "{{ container_test_report.test_result }}"
          ao_pre_patch_version: "{{ container_test_report.pre_patch_version }}"
          ao_post_patch_version: "{{ container_test_report.post_patch_version }}"

    - name: Cleanup test images
      containers.podman.podman_image:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ test_container_name }}-base"
        - "{{ test_container_name }}-patched"
