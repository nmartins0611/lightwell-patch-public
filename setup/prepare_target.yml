---
# Setup: Prepare Target Node
#
# Verifies the target kernel is at the vulnerable version and
# ensures scanning prerequisites are met for the demo.

- name: "Setup — Prepare Target Node for Demo"
  hosts: targets
  become: true
  gather_facts: true

  tasks:
    - name: Verify kernel version (should be vulnerable baseline)
      ansible.builtin.command:
        cmd: uname -r
      register: kernel_check
      changed_when: false

    - name: Display current kernel version
      ansible.builtin.debug:
        msg: "Target kernel: {{ kernel_check.stdout }} (expected: {{ demo_cve_vulnerable_version }})"

    - name: Confirm kernel is at vulnerable baseline
      ansible.builtin.assert:
        that:
          - demo_cve_vulnerable_version in kernel_check.stdout
        fail_msg: >-
          Kernel is not at the expected vulnerable version.
          Running: {{ kernel_check.stdout }}
          Expected: {{ demo_cve_vulnerable_version }}
          Restore from AMI snapshot if needed.
        success_msg: "Kernel at expected vulnerable version — demo ready"

    - name: Install Syft for SBOM generation
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/anchore/syft/main/install.sh"
        dest: /tmp/install-syft.sh
        mode: "0755"

    - name: Run Syft installer
      ansible.builtin.command:
        cmd: /tmp/install-syft.sh -b /usr/local/bin
        creates: /usr/local/bin/syft

    - name: Ensure output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ sbom_output_dir }}"
        - "{{ report_output_dir }}"
        - "/var/lib/cme"

    - name: Install firewalld (if not present)
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Ensure firewalld is running (for CME mitigations)
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Ensure auditd is running (for CME detection)
      ansible.builtin.systemd:
        name: auditd
        state: started
        enabled: true
