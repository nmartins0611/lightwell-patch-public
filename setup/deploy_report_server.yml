---
- name: Deploy report web server on builder node
  hosts: builders
  gather_facts: false

  vars:
    report_web_dir: /var/www/reports
    report_web_port: 8080

  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create reports directory
      ansible.builtin.file:
        path: "{{ report_web_dir }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"
        setype: httpd_sys_content_t

    - name: Deploy report index page
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../templates/report_index.html"
        dest: "{{ report_web_dir }}/index.html"
        owner: nginx
        group: nginx
        mode: "0644"

    - name: Create app health directory
      ansible.builtin.file:
        path: "{{ report_web_dir }}/app"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"
        setype: httpd_sys_content_t

    - name: Deploy app health page
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../templates/app_health.html"
        dest: "{{ report_web_dir }}/app/index.html"
        owner: nginx
        group: nginx
        mode: "0644"

    - name: Allow nginx to proxy to the local app
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Deploy nginx config for reports
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/reports.conf
        mode: "0644"
        content: |
          server {
              listen {{ report_web_port }};
              server_name _;
              root {{ report_web_dir }};
              index index.html;

              location = /health {
                  default_type application/json;
                  return 200 '{"status":"ok"}';
              }

              location /api/list/ {
                  alias {{ report_web_dir }}/;
                  index .no-index;
                  autoindex on;
                  autoindex_format json;
                  autoindex_exact_size off;
                  autoindex_localtime on;
                  default_type application/json;
                  add_header Access-Control-Allow-Origin *;
                  add_header Content-Type application/json always;
              }

              location /app/api/ {
                  proxy_pass http://127.0.0.1:{{ demo_app_port | default(8090) }}/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }

              location /app/ {
                  alias {{ report_web_dir }}/app/;
                  index index.html;
              }

              location / {
                  try_files $uri $uri/ /index.html;
                  add_header Access-Control-Allow-Origin *;
              }
          }
      notify: Restart nginx

    - name: Remove default server block
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^\s*listen\s+80'
        state: absent
      notify: Restart nginx

    - name: Open firewall for report server
      ansible.posix.firewalld:
        port: "{{ report_web_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Verify report server is responding
      ansible.builtin.uri:
        url: "http://localhost:{{ report_web_port }}/health"
        return_content: true
      register: health_check

    - name: Report server ready
      ansible.builtin.debug:
        msg: "Report server live at http://{{ ansible_host }}:{{ report_web_port }}/"

  handlers:
    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
