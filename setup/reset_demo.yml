- name: "Reset Demo — Reports and Artifacts"
  hosts: builders
  become: true
  gather_facts: false
  tags: [reports, all_demos]

  tasks:
    - name: Clear published reports from the web server
      ansible.builtin.shell:
        cmd: >-
          find {{ report_web_dir }} -maxdepth 1
          \( -name '*.json' -o -name '*.html' \)
          ! -name index.html -delete
      changed_when: true
      failed_when: false

    - name: Clear Gitea app SBOM on the builder
      ansible.builtin.file:
        path: "{{ demo_app_sbom_dir | default('/tmp/sbom-artifacts/app') }}"
        state: absent

    - name: Clear local report directory
      ansible.builtin.file:
