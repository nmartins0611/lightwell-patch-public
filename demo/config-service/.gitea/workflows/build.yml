name: Build after merge

# Runs when main moves, including after a GitOps PR is merged.
# Do not run on pull_request: the human merge is the approval gate.
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: python
    steps:
      - name: Checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/src
          cp -a /tmp/src/. .
          rm -rf /tmp/src/.git

      - name: Install dependencies from Lightwell PyPI
        run: |
          pip install --no-cache-dir \
            --extra-index-url http://lightwell-pypi:8081/simple/ \
            --trusted-host lightwell-pypi \
            -r requirements.txt

      - name: Show pyyaml version
        run: |
          python -c "import yaml; print('pyyaml version', yaml.__version__)"

      - name: Run smoke test
        run: |
          python -c "import yaml; data = yaml.safe_load('ok: true'); assert data['ok'] is True; print('SMOKE TEST PASSED')"

      - name: Run application health check
        run: |
          python app.py &
          sleep 3
          curl -sf http://localhost:8080/health
          echo
          curl -sf http://localhost:8080/version
          echo
          kill %1

  build-image:
    runs-on: docker
    needs: build-and-test
    defaults:
      run:
        shell: sh
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/src
          cp -a /tmp/src/. .
          rm -rf /tmp/src/.git

      - name: Build image with Lightwell index
        run: |
          DOCKER_BUILDKIT=0 docker build \
            -f Containerfile \
            --build-arg LIGHTWELL_INDEX=http://builder.example.com:8081/simple/ \
            --build-arg LIGHTWELL_HOST=builder.example.com \
            -t localhost/config-service:gitea \
            -t localhost/config-service:latest \
            .

      - name: Run patched app on host port 8090
        run: |
          docker rm -f config-service-app >/dev/null 2>&1 || true
          docker run -d \
            --name config-service-app \
            --network tcnet \
            -p 127.0.0.1:8090:8080 \
            -e CVE_FIX_APPLIED=CVE-2026-52891 \
            -e LIGHTWELL_FIX=pyyaml \
            localhost/config-service:gitea
          sleep 3
          docker exec config-service-app python -c "import yaml; print('container pyyaml', yaml.__version__)"

      - name: Produce app SBOM for TPA ingest
        run: |
          docker run --rm --user 0 --security-opt label=disable \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/sbom-artifacts/app:/out:Z \
            docker.io/anchore/syft:latest \
            scan localhost/config-service:gitea \
            --source-name config-service \
            --source-version "${GITHUB_SHA}" \
            -o cyclonedx-json@1.6=/out/config-service-sbom.json
          docker run --rm --user 0 --security-opt label=disable \
            -v /tmp/sbom-artifacts/app:/out:Z \
            docker.io/library/busybox:latest \
            ls -l /out/config-service-sbom.json

      - name: Notify AAP to ingest the SBOM
        env:
          EDA_SECRET: ${{ secrets.EDA_WEBHOOK_SECRET }}
          EDA_URL: ${{ vars.EDA_EVENT_STREAM_URL }}
        run: |
          if [ -z "${EDA_SECRET}" ] || [ -z "${EDA_URL}" ]; then
            echo "EDA_WEBHOOK_SECRET or EDA_EVENT_STREAM_URL not set; skip notify"
            exit 0
          fi
          apk add --no-cache openssl curl
          BODY='{"type":"app_sbom_ready","app_name":"config-service","image":"localhost/config-service:gitea"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "${EDA_SECRET}" | awk '{print $NF}')
          curl -k -sS -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            --data-binary "$BODY" \
            "${EDA_URL}"
