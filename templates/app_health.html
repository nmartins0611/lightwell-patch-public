<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>config-service — Lightwell Patch Demo</title>
<style>
  :root {
    --rh-red: #ee0000;
    --bg: #151515;
    --surface: #1f1f1f;
    --border: #3c3f42;
    --text: #e0e0e0;
    --text-secondary: #a3a3a3;
    --pass: #3e8635;
    --pass-light: #5ba352;
    --fail: #c9190b;
    --fail-light: #f56e6e;
    --accent: #73bcf7;
    --font: 'Red Hat Display', 'Red Hat Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 2rem; padding-bottom: 1.5rem;
    border-bottom: 3px solid var(--rh-red);
  }
  .logo {
    width: 48px; height: 48px; background: var(--rh-red);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.7rem; color: white; text-align: center; line-height: 1.1;
  }
  h1 { font-size: 1.6rem; color: #fff; }
  .header-meta { color: var(--text-secondary); font-size: 0.85rem; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 0.9rem; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 0.85rem; margin-bottom: 1.5rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fail-light); }
  .dot.ok { background: var(--pass-light); }
  .grid { display: grid; gap: 1rem; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.25rem 1.5rem;
  }
  .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 0.5rem; }
  .card .value { font-size: 1.2rem; font-weight: 700; color: #fff; }
  .card .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: 0.95rem; color: var(--accent); }
  pre {
    background: #111; border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem; overflow: auto; font-size: 0.8rem; color: var(--text-secondary);
  }
  a { color: var(--accent); }
  footer { margin-top: 2rem; padding-top: 1rem; border-top: 2px solid var(--rh-red); font-size: 0.8rem; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">APP<br>CVE</div>
    <div>
      <h1>config-service</h1>
      <div class="header-meta">Application dependency rebuild — CVE-2026-52891</div>
    </div>
  </header>

  <div class="status-pill" id="pill"><span class="dot" id="dot"></span> <span id="pill-text">Checking health…</span></div>

  <div class="grid">
    <div class="card">
      <h2>Service</h2>
      <div class="value" id="service">—</div>
    </div>
    <div class="card">
      <h2>pyyaml (fixed by Lightwell)</h2>
      <div class="value mono" id="pyyaml">—</div>
    </div>
    <div class="card">
      <h2>CVE fix applied</h2>
      <div class="value mono" id="cve">—</div>
    </div>
    <div class="card">
      <h2>Lightwell pin</h2>
      <div class="value mono" id="pin">—</div>
    </div>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2>Raw /version</h2>
    <pre id="raw">loading…</pre>
  </div>

  <footer>
    <a href="/">Back to reports</a>
    &nbsp;|&nbsp; Proxied from localhost:8090 on rhel02
  </footer>
</div>
<script>
(function() {
  function setPill(ok, text) {
    document.getElementById('dot').className = 'dot' + (ok ? ' ok' : '');
    document.getElementById('pill-text').textContent = text;
  }
  Promise.all([
    fetch('/app/api/health').then(function(r) { return r.json(); }),
    fetch('/app/api/version').then(function(r) { return r.json(); })
  ]).then(function(results) {
    var health = results[0];
    var version = results[1];
    setPill(health.status === 'healthy', health.status === 'healthy' ? 'Healthy' : 'Unhealthy');
    document.getElementById('service').textContent = version.service || health.service || 'config-service';
    document.getElementById('pyyaml').textContent = version.pyyaml_version || 'unknown';
    document.getElementById('cve').textContent = version.cve_fix_applied || 'none';
    document.getElementById('pin').textContent = version.lightwell_fix || 'none';
    document.getElementById('raw').textContent = JSON.stringify(version, null, 2);
  }).catch(function(err) {
    setPill(false, 'Unreachable');
    document.getElementById('raw').textContent = String(err);
  });
})();
</script>
</body>
</html>
