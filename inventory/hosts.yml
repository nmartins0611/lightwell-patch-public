---
# Replace these example hostnames with your own AWS lab.
# Keep secrets in vars/vault.yml — do not put passwords or tokens in this file.
all:
  vars:
    ansible_user: ec2-user
    ansible_become: true

  children:
    targets:
      hosts:
        node1:
          ansible_host: node1.example.com
          node_role: target_fleet
          environment_type: production
        node3:
          ansible_host: node3.example.com
          node_role: target_fleet
          environment_type: production
        node4:
          ansible_host: node4.example.com
          node_role: target_fleet
          environment_type: staging

    builders:
      hosts:
        node2:
          ansible_host: builder.example.com
          node_role: rhtpa_builder
          rhtpa_enabled: true

    eda:
      hosts:
        controller:
          ansible_host: aap.example.com
          ansible_connection: local
